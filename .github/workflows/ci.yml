name: SIAS CI

on:
  push:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.releaserc.json'
      - '.vscode/**'
      - '.husky/**'
      - '.impeccable/**'
      - '.qwen/**'
      - '.agents/**'
  pull_request:
    branches: [main, dev]
    paths-ignore:
      - 'docs/**'
      - '**.md'
      - '.gitignore'
      - '.releaserc.json'
      - '.vscode/**'
      - '.husky/**'
      - '.impeccable/**'
      - '.qwen/**'
      - '.agents/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_TEST_DEBUG: 0

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm run lint

      - name: Run Frontend Tests (Vitest)
        run: pnpm test --coverage

      - name: Install API dependencies
        working-directory: ./services/api
        run: pnpm install --frozen-lockfile

      - name: Run API Tests (Vitest)
        working-directory: ./services/api
        run: pnpm test --coverage

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri"
          cache-targets: true
          shared-key: ${{ runner.os }}

      - name: Install nextest
        uses: taiki-e/install-action@nextest

      - name: Run Backend Tests (Rust)
        working-directory: ./src-tauri
        run: cargo nextest run --profile ci --locked --junit-xml ../junit-rust.xml

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage/lcov.info,./services/api/coverage/lcov.info
          fail_ci_if_error: false

      - name: Upload test results to Codecov
        uses: codecov/test-results-action@v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./junit.xml,./services/api/junit.xml,./junit-rust.xml
          fail_ci_if_error: false
